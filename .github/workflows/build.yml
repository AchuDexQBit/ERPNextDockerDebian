name: Build and Push Client Image

on:
  push:
    branches:
      - "**"
  repository_dispatch:
    types:
      - client-stage-deploy
      - client-prod-deploy

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/dexqbit/erpnext

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      CLIENT_BRANCH: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch || github.ref_name }}
      CLIENT: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.client || '' }}
      TARGET_ENV: ${{ github.event_name == 'repository_dispatch' && (github.event.action == 'client-prod-deploy' && 'prod' || 'stage') || (github.ref_name == 'sparebox-prod' && 'prod' || 'stage') }}

    steps:
      - name: Checkout client branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CLIENT_BRANCH }}

      - name: Derive image tag
        id: meta
        run: |
          IMAGE_TAG="${{ env.IMAGE_PREFIX }}-${{ env.CLIENT_BRANCH }}:latest"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Require PAT for private bench get-app
        run: |
          if [ -z "${{ secrets.CUSTOMISATION_TOKEN }}" ]; then
            echo "::error::Repository secret CUSTOMISATION_TOKEN is not set."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/shared/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image_tag }}
          build-args: |
            GITHUB_PAT_TOKEN=${{ secrets.CUSTOMISATION_TOKEN }}
            DEPLOY_TARGET=ci
            CUSTOM_ERPNEXT_BRANCH=${{ env.TARGET_ENV }}
            CUSTOM_WHITELIST_GITHUB_PATH=DexQBit/MLBR-Sparebox-BE
            CUSTOM_WHITELIST_BRANCH=${{ env.TARGET_ENV }}
            BENCH_INSTALL_APPS=sparebox_be

  deploy-aws:
    needs: build-and-push
    if: |
      github.event_name == 'repository_dispatch' ||
      github.ref == 'refs/heads/sparebox-stage' ||
      github.ref == 'refs/heads/sparebox-prod'
    runs-on: ubuntu-latest
    env:
      TARGET_ENV: ${{ github.event_name == 'repository_dispatch' && (github.event.action == 'client-prod-deploy' && 'prod' || 'stage') || (github.ref_name == 'sparebox-prod' && 'prod' || 'stage') }}
    environment: ${{ (github.event_name == 'repository_dispatch' && github.event.client_payload.client || 'sparebox') }}-${{ github.event_name == 'repository_dispatch' && (github.event.action == 'client-prod-deploy' && 'prod' || 'stage') || (github.ref_name == 'sparebox-prod' && 'prod' || 'stage') }}

    steps:
      - name: Resolve deploy vars
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "compose_project=${{ github.event.client_payload.compose_project }}" >> $GITHUB_OUTPUT
            echo "env_file=${{ github.event.client_payload.env_file }}" >> $GITHUB_OUTPUT
            echo "site=${{ github.event.client_payload.site }}" >> $GITHUB_OUTPUT
          elif [ "${{ env.TARGET_ENV }}" = "prod" ]; then
            echo "compose_project=sparebox_prod" >> $GITHUB_OUTPUT
            echo "env_file=secrets/sparebox_prod.env" >> $GITHUB_OUTPUT
            echo "site=sparebox-prod.local" >> $GITHUB_OUTPUT
          else
            echo "compose_project=sparebox_stage" >> $GITHUB_OUTPUT
            echo "env_file=secrets/sparebox_stage.env" >> $GITHUB_OUTPUT
            echo "site=sparebox-stage.local" >> $GITHUB_OUTPUT
          fi

      - name: Deploy on AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /home/ubuntu/deploy
            docker image prune -a -f
            docker compose -p ${{ steps.vars.outputs.compose_project }} -f compose.yml --env-file ${{ steps.vars.outputs.env_file }} down
            docker compose -p ${{ steps.vars.outputs.compose_project }} -f compose.yml --env-file ${{ steps.vars.outputs.env_file }} pull
            docker compose -p ${{ steps.vars.outputs.compose_project }} -f compose.yml --env-file ${{ steps.vars.outputs.env_file }} up -d
            docker compose -p ${{ steps.vars.outputs.compose_project }} -f compose.yml --env-file ${{ steps.vars.outputs.env_file }} exec --user frappe erpnext bash -c "bench --site ${{ steps.vars.outputs.site }} migrate"
            docker compose -p ${{ steps.vars.outputs.compose_project }} -f compose.yml --env-file ${{ steps.vars.outputs.env_file }} exec --user frappe erpnext bash -c "bench build"
            docker compose -p ${{ steps.vars.outputs.compose_project }} -f compose.yml --env-file ${{ steps.vars.outputs.env_file }} exec --user frappe erpnext bash -c "bench --site ${{ steps.vars.outputs.site }} clear-cache"
