name: Build and Push Client Image

on:
  repository_dispatch:
    types:
      - client-stage-deploy
      - client-prod-deploy

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/dexqbit/erpnext
  CHECKOUT_REF: prod

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      CLIENT: ${{ github.event.client_payload.client }}
      TARGET_ENV: ${{ github.event.action == 'client-prod-deploy' && 'prod' || 'stage' }}
      WHITELIST_GITHUB_PATH: ${{ github.event.client_payload.whitelist_github_path }}
      BENCH_INSTALL_APPS: ${{ github.event.client_payload.bench_install_apps }}
      PIPECH_IMAGE_TAG: ${{ github.event.client_payload.pipech_image_tag || 'version-15-latest' }}
      FRAPPE_APPS_BRANCH: ${{ github.event.client_payload.frappe_apps_branch || 'version-15' }}
      ERPNEXT_BRANCH: ${{ github.event.client_payload.erpnext_branch || 'prod' }}

    steps:
      - name: Validate client_payload
        run: |
          missing=
          for pair in \
            "client=${{ env.CLIENT }}" \
            "whitelist_github_path=${{ env.WHITELIST_GITHUB_PATH }}" \
            "bench_install_apps=${{ env.BENCH_INSTALL_APPS }}"; do
            key="${pair%%=*}"
            val="${pair#*=}"
            if [ -z "$val" ]; then
              echo "::error::client_payload.$key is required"
              missing=1
            fi
          done
          if [ -n "$missing" ]; then
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Derive image tag
        id: meta
        run: |
          IMAGE_TAG="${{ env.IMAGE_PREFIX }}-${{ env.CLIENT }}-${{ env.TARGET_ENV }}:latest"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "pipech_image_tag=${{ env.PIPECH_IMAGE_TAG }}"
          echo "frappe_apps_branch=${{ env.FRAPPE_APPS_BRANCH }}"
          echo "erpnext_branch=${{ env.ERPNEXT_BRANCH }}"

      - name: Require PAT for private bench get-app
        run: |
          if [ -z "${{ secrets.CUSTOMISATION_TOKEN }}" ]; then
            echo "::error::Repository secret CUSTOMISATION_TOKEN is not set."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/shared/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image_tag }}
          build-args: |
            GITHUB_PAT_TOKEN=${{ secrets.CUSTOMISATION_TOKEN }}
            DEPLOY_TARGET=ci
            PIPECH_IMAGE_TAG=${{ env.PIPECH_IMAGE_TAG }}
            FRAPPE_APPS_BRANCH=${{ env.FRAPPE_APPS_BRANCH }}
            CUSTOM_ERPNEXT_BRANCH=${{ env.ERPNEXT_BRANCH }}
            CUSTOM_WHITELIST_GITHUB_PATH=${{ env.WHITELIST_GITHUB_PATH }}
            CUSTOM_WHITELIST_BRANCH=${{ env.TARGET_ENV }}
            BENCH_INSTALL_APPS=${{ env.BENCH_INSTALL_APPS }}
