name: Build and Push Client Image

on:
  push:
    branches:
      - "**"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/dexqbit/erpnext

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive image tag from branch name
        id: meta
        run: |
          IMAGE_TAG="${{ env.IMAGE_PREFIX }}-${GITHUB_REF_NAME}:latest"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Require PAT for private bench get-app
        run: |
          if [ -z "${{ secrets.CUSTOMISATION_TOKEN }}" ]; then
            echo "::error::Repository secret CUSTOMISATION_TOKEN is not set. Add a GitHub PAT with repo scope to clone private forks (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/shared/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image_tag }}
          build-args: |
            GITHUB_PAT_TOKEN=${{ secrets.CUSTOMISATION_TOKEN }}
            DEPLOY_TARGET=ci
            CUSTOM_ERPNEXT_GITHUB_PATH=
            CUSTOM_WHITELIST_GITHUB_PATH=DexQBit/MLBR-Sparebox-BE
            CUSTOM_WHITELIST_BRANCH=stage
            BENCH_INSTALL_APPS=sparebox_be
  deploy-aws:
    needs: build-and-push
    if: github.ref == 'refs/heads/sparebox-stage'
    runs-on: ubuntu-latest
    environment: sparebox-stage
    steps:
      - name: Deploy ERPNext on AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /home/ubuntu/deploy
            docker compose -p sparebox_stage -f compose.yml --env-file secrets/sparebox_stage.env pull erpnext
            docker compose -p sparebox_stage -f compose.yml --env-file secrets/sparebox_stage.env up -d erpnext
