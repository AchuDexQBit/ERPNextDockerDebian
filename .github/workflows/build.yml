name: Build and Push Client Image

on:
  push:
    branches:
      - "**"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/achudexqbit/erpnext

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive image tag from branch name
        id: meta
        run: |
          IMAGE_TAG="${{ env.IMAGE_PREFIX }}-${GITHUB_REF_NAME}:latest"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/shared/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image_tag }}
          build-args: |
            GITHUB_PAT_TOKEN=${{ secrets.CUSTOMISATION_TOKEN }}
            DEPLOY_TARGET=ci
