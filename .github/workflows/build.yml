name: Build and Push Client Image

on:
  repository_dispatch:
    types:
      - client-stage-deploy
      - client-prod-deploy

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/dexqbit/erpnext

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      CLIENT_BRANCH: ${{ github.event.client_payload.branch }}
      TARGET_ENV: ${{ github.event.action == 'client-prod-deploy' && 'prod' || 'stage' }}
      WHITELIST_GITHUB_PATH: ${{ github.event.client_payload.whitelist_github_path }}
      BENCH_INSTALL_APPS: ${{ github.event.client_payload.bench_install_apps }}

    steps:
      - name: Validate client_payload
        run: |
          missing=
          for pair in \
            "branch=${{ env.CLIENT_BRANCH }}" \
            "whitelist_github_path=${{ env.WHITELIST_GITHUB_PATH }}" \
            "bench_install_apps=${{ env.BENCH_INSTALL_APPS }}"; do
            key="${pair%%=*}"
            val="${pair#*=}"
            if [ -z "$val" ]; then
              echo "::error::client_payload.$key is required"
              missing=1
            fi
          done
          if [ -n "$missing" ]; then
            exit 1
          fi

      - name: Checkout client branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CLIENT_BRANCH }}

      - name: Derive image tag
        id: meta
        run: |
          IMAGE_TAG="${{ env.IMAGE_PREFIX }}-${{ env.CLIENT_BRANCH }}:latest"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Require PAT for private bench get-app
        run: |
          if [ -z "${{ secrets.CUSTOMISATION_TOKEN }}" ]; then
            echo "::error::Repository secret CUSTOMISATION_TOKEN is not set."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/shared/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image_tag }}
          build-args: |
            GITHUB_PAT_TOKEN=${{ secrets.CUSTOMISATION_TOKEN }}
            DEPLOY_TARGET=ci
            CUSTOM_WHITELIST_GITHUB_PATH=${{ env.WHITELIST_GITHUB_PATH }}
            CUSTOM_WHITELIST_BRANCH=${{ env.TARGET_ENV }}
            BENCH_INSTALL_APPS=${{ env.BENCH_INSTALL_APPS }}
