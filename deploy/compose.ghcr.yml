# Default GHCR deploy: MariaDB + Redis + ERPNext on one Docker network.
# Set RFP_DB_ROOT_PASSWORD in your env file (same value MariaDB uses here).
# Typical env: RFP_DB_HOST=db, RFP_DB_PORT=3306, RFP_REDIS_URL=redis://redis:6379
#
# frappe_sites persists /home/frappe/bench/sites (site_config, uploads). Without it, DB data survives
# container restarts but files do not → "Site … already exists" + restart loop.
#
# From repo root:
#   docker login ghcr.io -u USER -p <PAT_with_read:packages>
#   docker compose -f deploy/compose.ghcr.yml --env-file deploy/client.env up -d
#
# Minimal host: copy this file + client.env (+ secrets/) into one folder and adjust paths.
# For RDS / external DB+Redis only: remove the db and redis services (and depends_on), attach erpnext
# to your network, and set RFP_DB_HOST / RFP_REDIS_* to real hostnames.

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${RFP_DB_ROOT_PASSWORD:?set RFP_DB_ROOT_PASSWORD in your env file}
      MARIADB_CHARACTER_SET_SERVER: utf8mb4
      MARIADB_COLLATE_SERVER: utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  erpnext:
    image: ${GHCR_IMAGE:?Set GHCR_IMAGE in env file}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${ERPNext_HTTP_PORT:-80}:80"
    env_file:
      - ${CLIENT_ENV_FILE:-./client.env}
    volumes:
      - frappe_sites:/home/frappe/bench/sites

volumes:
  mariadb_data:
  frappe_sites:
