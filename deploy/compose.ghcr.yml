# Recommended deploy for AWS and Hetzner: pull the image CI pushed to GHCR (no bench build on the VPS).
# GHCR = runtime image only. Custom apps are cloned from Git during GitHub Actions (bench get-app), not on the server.
# Tag pattern: ghcr.io/<owner>/erpnext-<branch>:latest (.github/workflows/build.yml)
#
# From this repo’s root (paths below assume ./client.env lives next to this file under deploy/):
#   docker login ghcr.io -u USER -p <PAT_with_read:packages>
#   docker compose -f deploy/compose.ghcr.yml --env-file deploy/client.env up -d
#
# Minimal server (no full repo): copy this file + client.env into one folder, then:
#   docker compose -f compose.yml --env-file client.env up -d
# Each env file should set CLIENT_ENV_FILE to its own path (see deploy/client.env.example) so the
# container loads the same vars as compose interpolation (needed when using secrets/env.abc vs env.xyz).
#
# Two clients on one host (different -p and ports in each env file):
#   docker compose -p abc -f compose.yml --env-file secrets/env.abc up -d
#   docker compose -p xyz -f compose.yml --env-file secrets/env.xyz up -d
#
# GHCR login: echo TOKEN | docker login ghcr.io -u USER --password-stdin

services:
  erpnext:
    image: ${GHCR_IMAGE:?Set GHCR_IMAGE in client.env, e.g. ghcr.io/achudexqbit/erpnext-acme-prod:latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${ERPNext_HTTP_PORT:-80}:80"
    env_file:
      - ${CLIENT_ENV_FILE:-./client.env}
    environment:
      BENCH_EXTRA_APPS: ${BENCH_EXTRA_APPS:-}
